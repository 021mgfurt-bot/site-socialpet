<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SocialPet — a vida do seu pet, organizada com cuidado</title>
    <meta
      name="description"
      content="Vacinas, despesas, agenda e memórias de cada pet reunidas em um só lugar. Conheça o SocialPet."
    />
    <!-- canonical, og:url e robots são injetados em build time por
         vite.seo.plugin.ts, a partir de VITE_SITE_URL — ver FONTS.md/README
         para como configurar. Sem essa variável, o plugin injeta
         noindex/nofollow em vez de qualquer URL de domínio adivinhada. -->

    <!-- ?v=2: cache busting manual — favicon.ico/favicon-32.png/icon-192.png
         foram regenerados (removida a franja/moldura cor-de-creme fora do
         quadrado arredondado oficial, ver FONTS.md/histórico de commits).
         Sem isso, o cache agressivo de favicon do navegador continuaria
         servindo o arquivo antigo pela mesma URL. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />

    <!-- Inter é self-hosted (src/styles/fonts.css) — ver FONTS.md.
         Nenhuma requisição a domínio externo de fontes acontece. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SocialPet" />
    <meta property="og:title" content="SocialPet — a vida do seu pet, organizada com cuidado" />
    <meta
      property="og:description"
      content="Vacinas, despesas, agenda e memórias de cada pet reunidas em um só lugar."
    />
    <meta property="og:locale" content="pt_BR" />
    <!-- og:image/og:image:width/og:image:height/twitter:image (1200x630,
         public/og-image.png, gerado por qa/og-image/generate.mjs a partir
         de qa/og-image/template.html) são injetados em build time por
         vite.seo.plugin.ts, junto com canonical/og:url — só com URL
         absoluta quando VITE_SITE_URL existe (Prompt 14 §44-47). -->

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SocialPet — a vida do seu pet, organizada com cuidado" />
    <meta
      name="twitter:description"
      content="Vacinas, despesas, agenda e memórias de cada pet reunidas em um só lugar."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
